
name: failureintel-loadtest

services:
  postgres-database:
    image: postgres:16-alpine
    container_name: failureintel-db-loadtest
    restart: unless-stopped
    environment:
      POSTGRES_DB: failureintel_loadtest
      POSTGRES_USER: ${FAILUREINTEL_LOADTEST_DB_USER:?Set FAILUREINTEL_LOADTEST_DB_USER}
      POSTGRES_PASSWORD: ${FAILUREINTEL_LOADTEST_DB_PASSWORD:?Set FAILUREINTEL_LOADTEST_DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - loadtest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingestion-api:
    image: failureintel-api:local-loadtest
    container_name: failureintel-api-loadtest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped

    depends_on:
      postgres-database:
        condition: service_healthy

    environment:
      SERVER_PORT: "8081"

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-database:5432/failureintel_loadtest
      DB_USER: ${FAILUREINTEL_LOADTEST_DB_USER:?Set FAILUREINTEL_LOADTEST_DB_USER}
      DB_PASSWORD: ${FAILUREINTEL_LOADTEST_DB_PASSWORD:?Set FAILUREINTEL_LOADTEST_DB_PASSWORD}

      FAILURE_EVENT_WORKER_ENABLED: ${FAILURE_EVENT_WORKER_ENABLED:-true}
      FAILURE_EVENT_WORKER_BATCH_SIZE: ${FAILURE_EVENT_WORKER_BATCH_SIZE:-1}
      FAILURE_EVENT_WORKER_CONCURRENCY: ${FAILURE_EVENT_WORKER_CONCURRENCY:-1}

    ports:
      - "127.0.0.1:8082:8081"

    user: "10001:10001"
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
      - /app/logs:rw,noexec,nosuid,size=256m,uid=10001,gid=10001

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Permanent HTTP healthcheck
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - http://127.0.0.1:8081/actuator/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - loadtest

  k6:
    image: grafana/k6:latest
    container_name: failureintel-k6-loadtest
    profiles:
      - loadtest
    restart: "no"

    depends_on:
      ingestion-api:
        condition: service_healthy

    env_file:
      - .env.failureintel-loadtest

    environment:
      FAILUREINTEL_LOADTEST_BASE_URL: http://ingestion-api:8081

    volumes:
      - ./ingestion.js:/scripts/ingestion.js:ro

    networks:
      - loadtest

    entrypoint: ["k6"]
    command: ["run", "/scripts/ingestion.js"]

networks:
  loadtest:
    name: failureintel-loadtest-network

volumes:
  postgres-storage:
    name: failureintel-loadtest-postgres-storage
