spring:
  application:
    name: failureintel

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/failureintel}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: FailureIntelHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    out-of-order: false
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.failureintel: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: WARN
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized
      show-components: always

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

failure-event:
  ingestion:
    max-request-size-bytes: ${FAILURE_EVENT_MAX_REQUEST_SIZE_BYTES:1048576}
  processing:
    retry:
      max-attempts: ${FAILURE_EVENT_RETRY_MAX_ATTEMPTS:5}
      delays: ${FAILURE_EVENT_RETRY_DELAYS:PT1M,PT5M,PT30M,PT2H}
      jitter-fraction: ${FAILURE_EVENT_RETRY_JITTER_FRACTION:0.2}
